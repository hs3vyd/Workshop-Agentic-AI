<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#182230}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:16px;overflow:hidden}.messages{height:60vh;min-height:360px;overflow:auto;padding:20px}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.user{margin-left:auto;background:#5865f2;color:#fff}.assistant{background:#eef1f7}.controls{display:flex;gap:10px;padding:14px;border-top:1px solid #e1e6ef;flex-wrap:wrap}.controls select,.controls input,.controls button{font:inherit;padding:10px;border:1px solid #cbd3e1;border-radius:9px}.controls input{flex:1;min-width:180px}.controls button{background:#5865f2;color:#fff;border:0;cursor:pointer}.send{display:flex;gap:10px;padding:14px}.send textarea{flex:1;resize:vertical;min-height:44px;padding:10px;border:1px solid #cbd3e1;border-radius:9px;font:inherit}.back{color:#5865f2;text-decoration:none}</style></head>
<body><main class="wrap"><div class="top"><div><a class="back" href="/">← AI Desk</a><h1>หน้าต่าง Chat</h1></div></div><section class="panel"><div id="messages" class="messages"><div class="bubble assistant">สวัสดีครับ เลือก provider แล้วเริ่มคุยได้เลย</div></div><div class="controls"><label>Provider <select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model <input id="model" type="text" placeholder="ใช้ค่า default จากระบบ"></label></div><form id="form" class="send"><textarea id="message" placeholder="พิมพ์ข้อความ..." required></textarea><button type="submit">ส่ง</button></form></section></main><script src="/chat/app.js"></script></body></html>
